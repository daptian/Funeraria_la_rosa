<dialog id="modal_contrato" class="modal w-8/12 rounded-2xl">
    <div class="modal-box w-full p-0 bg-[#F7F4EE] rounded-lg shadow-lg">
        <div class="flex items-center justify-between px-6 py-3 border-b border-[#D4B96A]/20 bg-[#F7F4EE] rounded-t-lg">
            <h3 class="text-sm font-medium text-[#5a4a35]">Información del contrato</h3>
            <form method="dialog">
                <button class="bg-[#D4B96A]/10 border border-[#D4B96A]/40 text-[#D4B96A] rounded-full w-7 h-7 flex items-center justify-center text-sm cursor-pointer leading-none transition-colors hover:bg-[#D4B96A]/20">✕</button>
            </form>
        </div>

        <div class="h-[calc(100%-48px)] overflow-y-auto p-6">
            <div id="contenido-contrato" class="text-sm text-[#5a4a35] leading-relaxed">
            </div>
    </div>

    <form method="dialog" class="modal-backdrop">
        <button class="cursor-default hidden">close</button>
    </form>

    <button class=" flex text-sm gap-2 items-center text-red-500 underline px-2 py-2"
        onclick="eliminarContrato()"
    >
        <svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
        </svg>
        Eliminar Contrato
    <button>

</dialog>
