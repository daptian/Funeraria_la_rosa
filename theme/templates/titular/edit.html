<dialog id="modal_titular_edit" class="modal w-8/12 rounded-2xl">
    <div class="modal-box w-full p-0 bg-[#F7F4EE] rounded-lg shadow-lg">
        <div class="flex items-center justify-between px-6 py-3 border-b border-[#D4B96A]/20 bg-[#1C1410] rounded-t-lg">
            <h3 class="text-sm font-medium text-[#9a8a70] flex w-max gap-2">
                <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                </svg>
                Editar Informacion del Titular</h3>
            <form method="dialog">
                <button class="bg-[#D4B96A]/10 border border-[#D4B96A]/40 text-[#D4B96A] rounded-full w-7 h-7 flex items-center justify-center text-sm cursor-pointer leading-none transition-colors hover:bg-[#D4B96A]/20">✕</button>
            </form>
        </div>

        <div class="h-[calc(100%-48px)] overflow-y-auto p-6">
            <div class="text-sm text-[#5a4a35] leading-relaxed">
                <form class="grid grid-cols-2 text-xs" method="POST" id="contenido-titular-edit">
                    {% csrf_token %}

                </form >
            </div>
    </div>


    <form method="dialog" class="modal-backdrop">
        <button class="cursor-default hidden">close</button>
    </form>

</dialog>
